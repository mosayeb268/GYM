name: Build Kinetic Care OS APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Setup local.properties
        run: |
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build_output.txt || true
          echo "## 📋 خروجی بیلد گریدل" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 250 ../build_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if grep -q "BUILD SUCCESSFUL" ../build_output.txt; then
            echo "✅ Build completed successfully"
          else
            echo "❌ Build failed - publishing logs to build-logs branch"
            cd ..
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-logs
            git add -f build_output.txt
            git commit -m "build failure log" || true
            git push -f origin build-logs || true
            exit 1
          fi

      - name: Locate and Collect APK
        run: |
          mkdir -p release-apks
          find . -name "*.apk" -type f -exec cp -v {} release-apks/ \;
          ls -la release-apks/
          if [ ! -f release-apks/*.apk ]; then
            echo "❌ No APK file found in workspace!"
            find . -type d -name "build"
            exit 1
          fi
          echo "✅ APK ready for release:"
          ls -lh release-apks/*.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KineticCare-OS-v1.0.0-Debug-APK
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Reports on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gradle-build-failure-reports
          path: |
            android/**/build/reports/
          retention-days: 7

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Kinetic Care OS v1.0.0 (نسخه رسمی اندروید)"
          files: release-apks/*.apk
          fail_on_unmatched_files: true
          body: |
            ## 📱 فایل نصبی سامانه جامع کینتیک کر (Kinetic Care OS)
            ### ویژه کلینیک ورزشی و حرکات اصلاحی دکتر قدم‌پور (Ph.D. فیزیولوژی ورزشی)
            
            فایل نصبی APK نسخه دیباگ جهت تست و اجرا روی انواع گوشی‌های هوشمند و تبلت‌های اندروید.
            
            ---
            ### 🌟 قابلیت‌های نسخه ۱.۰.۰:
            - **طراحی ۱۰۰٪ راست‌به‌چپ (RTL) و تایپوگرافی وزیرمتن** با ارقام فارسی و تقویم شمسی جلالی.
            - **فوتوگرامتری خطوط شاقولی با سنسور شیب‌سنج تراز ژیروسکوپ** در CameraX.
            - **مقایسه قبل و بعد اصلاح ساختار قامت** با اسلایدر شبح (Ghost Overlay).
            - **بارکد پویای تردد گیت (Dynamic QR)** با توکن امنیتی بر پایه HMAC و تلرانس زمانی.
            - **ثبت نمره درد دیداری مراجع (VAS)** و اعمال رگرسیون هوشمند حرکات متداخل (قفل ددلیفت به پل باسن).
            - **ماژول کامل پذیرش و تشکیل پرونده، حسابداری شهریه به تومان، صدور فاکتور رسمی و تنظیم سهمیه جلسات.**
            - **سیستم مانیتورینگ آنلاین گیت و تخصیص کمد هوشمند (Smart Locker)** به همراه هشدار CRM غیبت.
            - **صدور گزارش رسمی ارتوپدی (PDF)** با حل مشکل گسستگی حروف فارسی (BiDi Reshaper).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
